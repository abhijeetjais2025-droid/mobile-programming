<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Calculator</title>
</head>
<body>

    <h2>Student Marks Calculator</h2>

    <label>Subject 1:</label>
    <input type="number" id="mark1"><br><br>

    <label>Subject 2:</label>
    <input type="number" id="mark2"><br><br>

    <label>Subject 3:</label>
    <input type="number" id="mark3"><br><br>

    <label>Subject 4:</label>
    <input type="number" id="mark4"><br><br>

    <label>Subject 5:</label>
    <input type="number" id="mark5"><br><br>

    <label>Subject 6:</label>
    <input type="number" id="mark6"><br><br>

    <label>Subject 7:</label>
    <input type="number" id="mark7"><br><br>

    <label>Subject 8:</label>
    <input type="number" id="mark8"><br><br>

    <button onclick="calculateMarks()">Calculate</button>

    <h3>Result</h3>

    <p>Total Marks: <span id="total">0</span></p>
    <p>Average: <span id="average">0</span></p>
    <p>Percentage: <span id="percentage">0</span>%</p>

    <script>
        function calculateMarks() {

            let mark1 = Number(document.getElementById("mark1").value);
            let mark2 = Number(document.getElementById("mark2").value);
            let mark3 = Number(document.getElementById("mark3").value);
            let mark4 = Number(document.getElementById("mark4").value);
            let mark5 = Number(document.getElementById("mark5").value);
            let mark6 = Number(document.getElementById("mark6").value);
            let mark7 = Number(document.getElementById("mark7").value);
            let mark8 = Number(document.getElementById("mark8").value);

            let total = mark1 + mark2 + mark3 + mark4 +
                        mark5 + mark6 + mark7 + mark8;

            let average = total / 8;

            let percentage = (total / 800) * 100;

            document.getElementById("total").innerText = total;
            document.getElementById("average").innerText = average.toFixed(2);
            document.getElementById("percentage").innerText = percentage.toFixed(2);
        }
    </script>

</body>
</html>
